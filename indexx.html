<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NeoCrime DriverHub</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f0f0f;
            color: white;
            padding: 20px;
        }

        .card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #2b2b2b;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .row {
            margin-top: 12px;
        }

        .label {
            color: #888;
            font-size: 14px;
        }

        .value {
            font-size: 18px;
            margin-top: 4px;
        }

        .loading {
            margin-top: 40px;
            text-align: center;
            color: #999;
        }

        .error {
            margin-top: 20px;
            background: #3b1111;
            border: 1px solid #7a1d1d;
            padding: 15px;
            border-radius: 12px;
            color: #ffb3b3;
        }
    </style>
</head>
<body>

    <h1>NeoCrime DriverHub</h1>
    <p>Telegram Mini App</p>

    <div id="content">
        <div class="loading">Загрузка данных...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function loadUser() {
            try {
                const response = await fetch('https://api.neocrime.space/api/user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        initData: tg.initData
                    })
                });
                
                // Здесь будет логика обработки ответа (response.json() и т.д.)
                
            } catch (error) {
                console.error("Ошибка при загрузке данных:", error);
            }
        }
        
        // Не забудьте вызвать функцию, когда это будет необходимо:
        // loadUser();
    </script>

</body>
</html>
